# Build the site, run the tests, and deploy to GitHub Pages.
# Pull requests and other branches only build and test.
# Repo setting needed once: Settings -> Pages -> Source: "GitHub Actions".
name: Build, test, deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Same image as `docker compose run test`: Node plus the test browsers.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      # Optimized images are only made again when a source image changes.
      - uses: actions/cache@v6
        with:
          path: _site/img
          key: img-${{ github.sha }}
          restore-keys: img-
      - run: npm ci
      - run: npx @11ty/eleventy
      - run: npx playwright test
        env:
          CI: "1"
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
