# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Andreu
description: >- # this means to ignore newlines until "baseurl:"
  Andreu Matoses Gimenez, personal website.

author: Andreu Matoses Gimenez

# If you're hosting your site at a Project repository on GitHub pages
# (http://yourusername.github.io/repository-name)
# and NOT your User repository (http://yourusername.github.io)
# then add in the baseurl here, like this: "/repository-name"
# baseurl: "/website" # the subpath of your site, e.g. /blog
url: "http://andreumatoses.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Enter your Google Analytics web tracking code (e.g. UA-2110908-2) to activate tracking
google_analytics: G-ZQN5G9F3CC

permalink: /:year/:month/:day/:title/

# Collections. Output true if you want to generate pages for the items in the collection, false if not.
collections:
  posts:
    output: true
    permalink: /:collection/:name
  research:
    output: true
    permalink: /:collection/:name

# defaults
defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "default"
  -
    scope:
      path: "" # an empty string here means all files in the project
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "research" # a collection in your site, in plural form
    values:
      layout: "paper"
      usemathjax: true
  -
    scope:
      path: ""
      type: "posts" # a collection in your site, in plural form
    values:
      layout: "post"
      usemathjax: true
      show_toc: true

# Build settings (theme is null as we use our own theme)
theme: null
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from


# Exclude from processing.
# CLAUDE.md is a dev doc, not a site page. It has no front matter and contains
# `{% include %}` examples; on GitHub Pages the jekyll-optional-front-matter plugin
# renders front-matter-less markdown through Liquid, so those examples would crash
# the build. Excluding it keeps it out of the published site entirely.
exclude:
  - CLAUDE.md

# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
